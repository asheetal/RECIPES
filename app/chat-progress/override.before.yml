        read_only: true
      - type: bind
        source: /home/sheetal/librechat/file-panels-20261002T110630Z/runtime
        target: /app/project-files-feature
        read_only: true
      - type: bind
        source: /home/sheetal/librechat/project-files-20261002T075912Z/backend/projects.js
        target: /app/api/server/routes/projects.js
        read_only: true
      - type: bind
        source: /home/sheetal/librechat/project-files-20261002T075912Z/backend/code-process.js
        target: /app/api/server/services/Files/Code/process.js
        read_only: true
      - type: bind
        source: /home/sheetal/librechat/email-templates-20261003T064433Z
